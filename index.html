<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf6fd" />
    <title>Nawras أيّهما؟</title>
    <link rel="icon" type="image/png" sizes="1280x1280" href="%BASE_URL%assets/branding/nawras-small.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/branding/nawras-small.png" />
  </head>
  <body>
    <div class="particles" aria-hidden="true"></div>
    <main id="app"></main>
    <dialog id="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-description">
      <h2 id="clear-title">Clear leaderboard?</h2>
      <p id="clear-description">This will permanently delete all saved scores.</p>
      <div class="dialog-actions">
        <button id="cancel-clear" autofocus>Cancel</button>
        <button id="confirm-clear" class="gold">Clear</button>
      </div>
      <button id="close-clear" class="dialog-close" type="button" aria-label="Close clear popup">×</button>
      <p id="clear-error" class="status" role="alert" hidden></p>
    </dialog>
    <dialog id="reset-dialog" aria-labelledby="reset-title">
      <button id="close-reset" class="dialog-close" type="button" aria-label="Close reset popup">×</button>
      <h2 id="reset-title">Reset game?</h2>
      <div class="dialog-actions reset-actions">
        <button id="reset-home" type="button">Home Screen</button>
        <button id="reset-round" class="gold" type="button">Reset Game</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
